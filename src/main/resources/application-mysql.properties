# Activate with: --spring.profiles.active=mysql
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:platetracker}?serverTimezone=America/Toronto&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USER:platetracker}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.thymeleaf.cache=true

# No demo data and no default password outside dev: the app refuses to start without APP_ADMIN_PASSWORD.
app.demo-data=false
app.bootstrap.admin-password=${APP_ADMIN_PASSWORD}
