spring.application.name=plate-tracker

# Dev database: file-based H2 in ./data (no install needed). Use the "mysql" profile for a real DB.
spring.datasource.url=jdbc:h2:file:./data/platetracker;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# Fine for a skeleton. Switch to Flyway migrations + "validate" before real use.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false

# Time stamps for "time out" / "time in" use this zone, not the server's.
app.timezone=America/Toronto

# First-run admin account (only created when there are no users yet). Change it!
app.bootstrap.admin-username=admin
app.bootstrap.admin-password=admin123

# Seeds sample employees, plates and a couple of demo logins on first run.
app.demo-data=true
