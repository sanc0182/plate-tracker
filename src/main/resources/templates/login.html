<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign in')}"></head>
<body>
<main class="login">
    <div class="card">
        <h1>Plate Tracker</h1>
        <div class="flash err" th:if="${param.error}" role="alert">Wrong username or password.</div>
        <div class="flash ok" th:if="${param.logout}" role="status">You have been signed out.</div>
        <form th:action="@{/login}" method="post">
            <label>Username
                <input type="text" name="username" autocomplete="username" autofocus required>
            </label>
            <label>Password
                <input type="password" name="password" autocomplete="current-password" required>
            </label>
            <button type="submit">Sign in</button>
        </form>
    </div>
</main>
</body>
</html>
